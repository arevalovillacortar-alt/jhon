<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Página Web</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#0077cc;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    background:#005fa3;
    padding:10px;
}

nav ul{
    display:flex;
    justify-content:center;
    list-style:none;
}

nav ul li{
    margin:0 15px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:1000px;
    margin:30px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
    margin-bottom:20px;
}

button{
    background:#0077cc;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#005fa3;
}

#mensaje{
    margin-top:15px;
    font-weight:bold;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
</style>
</head>

<body>

<header>
    <h1>Mi Sitio Web</h1>
    <p>Proyecto HTML, CSS y JavaScript</p>
</header>

<nav>
    <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Servicios</a></li>
        <li><a href="#">Contacto</a></li>
    </ul>
</nav>

<div class="container">

    <div class="card">
        <h2>Bienvenido</h2>
        <p>
            Esta es una página web moderna creada con HTML, CSS y JavaScript.
        </p>
    </div>

    <div class="card">
        <h2>Interacción</h2>
        <button onclick="mostrarMensaje()">
            Haz clic aquí
        </button>

        <p id="mensaje"></p>
    </div>

</div>

<footer>
    <p>© 2026 Todos los derechos reservados</p>
</footer>

<script>
function mostrarMensaje(){
    const fecha = new Date();

    document.getElementById("mensaje").innerHTML =
    "¡Hola! Has presionado el botón correctamente.<br><br>" +
    "Fecha y hora actual: " + fecha.toLocaleString();
}
</script>

</body>
</html>
